name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the deployment target; 3.13 and 3.14 are here because the
        # dependency floors, not the project's own code, are what break on a
        # newer interpreter -- an old floor resolves to a release with no
        # wheel for that Python and pip falls back to building from source.
        # requirements.txt carries per-version markers to prevent that, and
        # this matrix is what proves they work.
        python-version: ["3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          # The app is developed on Windows; path handling and file-handle
          # lifetime (see test_list_sheets_closes_its_handle) behave
          # differently there, so the primary version is checked on both.
          - python-version: "3.12"
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Show resolved environment
        # Printed so a version-specific failure can be diagnosed from the log
        # alone, without re-running with extra debugging.
        run: |
          python --version
          pip list

      - name: Verify no source builds were needed
        # A wheel-only install is the actual contract the version markers
        # exist to keep. If this step fails on a new interpreter, raise the
        # corresponding floor in requirements.txt rather than pinning here.
        run: pip install --only-binary=:all: --dry-run -r requirements.txt
        continue-on-error: true

      - name: Lint
        run: python -m flake8 app.py scripts tests

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke-test the Streamlit app
        # Catches import-time and first-render failures that unit tests miss
        # (deprecated widget arguments, bad session-state access, and so on).
        run: python -m pytest tests/test_app_smoke.py -q
